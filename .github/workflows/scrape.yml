name: Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build scraper image
        run: docker build -t scraper -f scraper/Dockerfile .

      - name: Run scraper
        run: docker run --rm -e MONGO_URI="${{ secrets.MONGO_URI }}" -e RETAILER=all --shm-size=2gb scraper
