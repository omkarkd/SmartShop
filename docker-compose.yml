services:
  scraper:
    build: .
    image: smartshop-scraper
    container_name: smartshop-scraper
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017}
      - DB_NAME=${DB_NAME:-smartshop}
      - RETAILER=${RETAILER:-all}
      - CHROME_HEADLESS=true
    # Give Chrome enough shared memory
    shm_size: 2gb
    # Restart on crash (network blips, etc.)
    restart: unless-stopped
