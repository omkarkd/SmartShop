services:
  admin:
    build: .
    image: smartshop-admin
    container_name: smartshop-admin
    ports:
      - "8501:8501"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://host.docker.internal:27017}
      - DB_NAME=${DB_NAME:-smartshop}
      - CHROME_HEADLESS=true
    shm_size: 2gb
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
