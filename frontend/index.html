<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartShop - Compare Prices</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>SmartShop</h1>
      <p class="subtitle">Compare prices across <span>Aldi</span> &amp; <span>Sainsbury's</span></p>

      <div id="auth-error" class="auth-error"></div>

      <!-- Signup Form -->
      <form id="signup-form">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input id="signup-name" type="text" placeholder="e.g. John Smith" required>
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" placeholder="At least 6 characters" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <!-- Login Form -->
      <form id="login-form" style="display:none;">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="Your password" required>
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:8px;">
          <input id="remember-me" type="checkbox" style="width:auto;">
          <label for="remember-me" style="margin:0;font-weight:400;font-size:0.85rem;color:#666;">Remember me for 24h</label>
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <div class="auth-toggle">
        <span id="auth-toggle-text">Already have an account?</span>
        <a id="auth-toggle-link" href="#">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
